            # 项目名称（必填）
            name: EcoFlow
            # 主页网址（必填）
            homepage_url: https://cncf.io
            # logo 文件名（必填）。logo 文件应放在 landscape 的 logo 路径（如 `hosted-logos`）下。仅支持文件名，不支持 URL，且必须为 SVG 文件。
            logo: EcoFlow.svg
